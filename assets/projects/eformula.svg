<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070C18"/><stop offset="1" stop-color="#1A1228"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4FD1C5"/></marker>
    <style>
      .m{font-family:'JetBrains Mono',Consolas,'Liberation Mono',monospace}
      .s{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif}
      .flow{stroke-dasharray:6 6;animation:f 1s linear infinite}@keyframes f{to{stroke-dashoffset:-24}}
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="40" y="62" class="m" font-size="15" font-weight="700" letter-spacing="3" fill="#FF6B4A">A-FA e-FORMULA · 2025</text>
  <text x="40" y="100" class="s" font-size="32" font-weight="800" fill="#FFFFFF">차량 계측 · 텔레메트리 시스템</text>

  <g class="s" text-anchor="middle">
    <!-- sim -->
    <rect x="40" y="150" width="200" height="86" rx="12" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="140" y="186" font-size="18" font-weight="800" fill="#FFFFFF">CAN 시뮬레이터</text>
    <text x="140" y="212" class="m" font-size="13" fill="#8FA4C8">Arduino · C++</text>
    <!-- sensors -->
    <rect x="40" y="286" width="200" height="86" rx="12" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="140" y="322" font-size="18" font-weight="800" fill="#FFFFFF">차량 센서</text>
    <text x="140" y="348" class="m" font-size="13" fill="#8FA4C8">CAN bus</text>
    <!-- ECU -->
    <rect x="330" y="200" width="220" height="130" rx="14" fill="#1F1428" stroke="#E7352C" stroke-width="2.5"/>
    <text x="440" y="244" font-size="22" font-weight="900" fill="#FFFFFF">ECU</text>
    <text x="440" y="272" class="m" font-size="15" font-weight="700" fill="#FF8A73">STM32F4</text>
    <text x="440" y="302" class="m" font-size="12" fill="#C9B2BC">버퍼 2분할 · SD 로깅</text>
    <!-- RPi display -->
    <rect x="650" y="140" width="270" height="96" rx="12" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="785" y="178" font-size="18" font-weight="800" fill="#FFFFFF">운전석 디스플레이</text>
    <text x="785" y="206" class="m" font-size="13" fill="#8FA4C8">Raspberry Pi 5 · 저항식 터치</text>
    <!-- ESP32 → server -->
    <rect x="650" y="292" width="270" height="96" rx="12" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="785" y="330" font-size="18" font-weight="800" fill="#FFFFFF">원격 텔레메트리</text>
    <text x="785" y="358" class="m" font-size="13" fill="#8FA4C8">ESP32 → WSS · Socket.IO</text>
    <!-- web -->
    <rect x="650" y="430" width="270" height="76" rx="12" fill="#0E2A2A" stroke="#4FD1C5" stroke-width="2"/>
    <text x="785" y="464" font-size="17" font-weight="800" fill="#FFFFFF">Live · Review 웹</text>
    <text x="785" y="490" class="m" font-size="12.5" fill="#8FD8CF">Node.js · Nginx · 그래프/지도/CSV</text>
  </g>

  <g fill="none" stroke="#4FD1C5" stroke-width="2.5" marker-end="url(#ar)" class="flow">
    <path d="M240 193 C285 193 290 240 328 245"/>
    <path d="M240 329 C285 329 290 290 328 285"/>
    <path d="M550 245 C600 245 600 188 648 188"/>
    <path d="M550 285 C600 285 600 340 648 340"/>
    <path d="M785 388 L785 428"/>
  </g>
  <text x="300" y="460" class="m" font-size="13" fill="#5D739B">CAN → STM32F4 → (Display + Telemetry) → Web</text>
</svg>
