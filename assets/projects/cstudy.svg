<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070C18"/><stop offset="1" stop-color="#1A1530"/></linearGradient>
    <style>
      .m{font-family:'JetBrains Mono',Consolas,'Liberation Mono',monospace}
      .s{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="40" y="62" class="m" font-size="15" font-weight="700" letter-spacing="3" fill="#FF6B4A">C / C++ · EMBEDDED C</text>
  <text x="40" y="100" class="s" font-size="32" font-weight="800" fill="#FFFFFF">펌웨어 코드를 직접 쓰는 힘 다지기</text>
  <g class="s" text-anchor="middle">
    <rect x="40" y="150" width="270" height="190" rx="14" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="175" y="192" class="m" font-size="15" font-weight="700" fill="#FF6B4A">PART A</text>
    <text x="175" y="232" font-size="26" font-weight="800" fill="#FFFFFF">언어 기초</text>
    <text x="175" y="272" font-size="16" fill="#B9C7E0">포인터 · 구조체</text>
    <text x="175" y="300" font-size="16" fill="#B9C7E0">메모리 구조 · STL</text>
    <text x="330" y="256" font-size="32" fill="#FF6B4A">→</text>
    <rect x="345" y="150" width="270" height="190" rx="14" fill="#121C33" stroke="#3B5A8C" stroke-width="2"/>
    <text x="480" y="192" class="m" font-size="15" font-weight="700" fill="#FF6B4A">PART B</text>
    <text x="480" y="232" font-size="26" font-weight="800" fill="#FFFFFF">알고리즘</text>
    <text x="480" y="272" font-size="16" fill="#B9C7E0">프로그래머스</text>
    <text x="480" y="300" font-size="16" fill="#B9C7E0">Lv.0 → Lv.3 (C++)</text>
    <text x="635" y="256" font-size="32" fill="#FF6B4A">→</text>
    <rect x="650" y="150" width="270" height="190" rx="14" fill="#1F1428" stroke="#E7352C" stroke-width="2"/>
    <text x="785" y="192" class="m" font-size="15" font-weight="700" fill="#FF6B4A">PART C</text>
    <text x="785" y="232" font-size="26" font-weight="800" fill="#FFFFFF">임베디드 C</text>
    <text x="785" y="272" font-size="16" fill="#E3CAD3">volatile · ISR · 링 버퍼</text>
    <text x="785" y="300" font-size="16" fill="#E3CAD3">PID · CAN 파싱</text>
  </g>
  <rect x="40" y="380" width="880" height="120" rx="12" fill="#050912" stroke="#1E2E50"/>
  <text x="66" y="424" class="m" font-size="17" fill="#4FD1C5">$ g++ -std=c++17 -Wall -Wextra ring_buffer.cpp &amp;&amp; ./a.out</text>
  <text x="66" y="462" class="m" font-size="17" fill="#8FA4C8">volatile uint8_t head, tail;  <tspan fill="#FFD166">// ISR-safe</tspan><tspan class="cur" fill="#FFFFFF"> █</tspan></text>
</svg>
