<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C18"/>
      <stop offset="0.55" stop-color="#0E1A33"/>
      <stop offset="1" stop-color="#241020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#E7352C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E7352C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FC2FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B5A8C" stroke-opacity="0.14"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="20"/></clipPath>
    <clipPath id="logClip"><rect x="64" y="318" width="600" height="72"/></clipPath>
    <clipPath id="roadClip"><rect x="700" y="0" width="580" height="420"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .pre text{white-space:pre}
      .sans{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- ================= LEFT : IDENTITY ================= -->
    <g>
      <circle cx="70" cy="66" r="5" fill="#FF4D3A">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="71" class="mono" font-size="14" font-weight="700" letter-spacing="4" fill="#FF6B4A">VEHICLE EMBEDDED SYSTEMS · ADAS</text>
    </g>

    <text x="62" y="152" class="sans" font-size="66" font-weight="900" letter-spacing="1" fill="url(#nameGrad)">MOON JAEWOONG</text>
    <rect x="66" y="168" width="0" height="4" rx="2" fill="#FF4D3A">
      <animate attributeName="width" values="0;120;120" keyTimes="0;0.3;1" dur="3s" fill="freeze"/>
    </rect>

    <text x="64" y="218" class="sans" font-size="26" font-weight="700" fill="#E6EDF8">센서 핀 하나에서, 결승선까지.</text>
    <text x="64" y="248" class="sans" font-size="16" fill="#8FA4C8">I build the hardware that reads the car, and the code that lets it see the road.</text>

    <!-- chips -->
    <g class="mono" font-size="12.5" font-weight="700" fill="#E8EEF9" text-anchor="middle">
      <rect x="64" y="268" width="150" height="30" rx="15" fill="#13203B" stroke="#3B5A8C"/>
      <text x="139" y="288">CAN · I2C · UART</text>
      <rect x="224" y="268" width="196" height="30" rx="15" fill="#13203B" stroke="#3B5A8C"/>
      <text x="322" y="288">ESP32 · STM32 · Teensy</text>
      <rect x="430" y="268" width="116" height="30" rx="15" fill="#13203B" stroke="#3B5A8C"/>
      <text x="488" y="288">ADAS · LiDAR</text>
      <rect x="556" y="268" width="140" height="30" rx="15" fill="#2A1222" stroke="#E7352C"/>
      <text x="626" y="288">Real-car Tested</text>
    </g>

    <!-- live CAN log (candump style) -->
    <rect x="56" y="310" width="620" height="88" rx="10" fill="#050912" stroke="#1E2E50"/>
    <g clip-path="url(#logClip)" class="mono pre" font-size="12.5" xml:space="preserve">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -126" dur="6s" repeatCount="indefinite"/>
        <text x="74" y="334"><tspan fill="#5D739B">(0.000)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">0C1</tspan><tspan fill="#C9D6EE">  [8]  3F 2C 00 7D 11 00 A4 05</tspan><tspan fill="#5D739B">  ECU · RPM</tspan></text>
        <text x="74" y="355"><tspan fill="#5D739B">(0.010)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">1A0</tspan><tspan fill="#C9D6EE">  [6]  02 B8 01 F4 00 3E</tspan><tspan fill="#5D739B">        SUSP · FL FR</tspan></text>
        <text x="74" y="376"><tspan fill="#5D739B">(0.020)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">2B4</tspan><tspan fill="#C9D6EE">  [8]  00 2B FF D6 03 E8 00 00</tspan><tspan fill="#5D739B">  IMU · PITCH</tspan></text>
        <text x="74" y="397"><tspan fill="#5D739B">(0.030)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">3E8</tspan><tspan fill="#C9D6EE">  [4]  00 3E 01 9A</tspan><tspan fill="#5D739B">              GPS · SPEED</tspan></text>
        <text x="74" y="418"><tspan fill="#5D739B">(0.040)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">1A1</tspan><tspan fill="#C9D6EE">  [6]  02 A0 01 E2 00 41</tspan><tspan fill="#5D739B">        SUSP · RL RR</tspan></text>
        <text x="74" y="439"><tspan fill="#5D739B">(0.050)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">7DF</tspan><tspan fill="#C9D6EE">  [8]  02 01 0C 00 00 00 00 00</tspan><tspan fill="#5D739B">  DIAG · REQ</tspan></text>
        <!-- repeat first lines for seamless loop -->
        <text x="74" y="460"><tspan fill="#5D739B">(0.060)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">0C1</tspan><tspan fill="#C9D6EE">  [8]  3F 2C 00 7D 11 00 A4 05</tspan><tspan fill="#5D739B">  ECU · RPM</tspan></text>
        <text x="74" y="481"><tspan fill="#5D739B">(0.070)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">1A0</tspan><tspan fill="#C9D6EE">  [6]  02 B8 01 F4 00 3E</tspan><tspan fill="#5D739B">        SUSP · FL FR</tspan></text>
        <text x="74" y="502"><tspan fill="#5D739B">(0.080)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">2B4</tspan><tspan fill="#C9D6EE">  [8]  00 2B FF D6 03 E8 00 00</tspan><tspan fill="#5D739B">  IMU · PITCH</tspan></text>
        <text x="74" y="523"><tspan fill="#5D739B">(0.090)</tspan><tspan fill="#4FD1C5">  can0  </tspan><tspan fill="#FFD166">3E8</tspan><tspan fill="#C9D6EE">  [4]  00 3E 01 9A</tspan><tspan fill="#5D739B">              GPS · SPEED</tspan></text>
      </g>
    </g>

    <!-- ================= RIGHT : SYMBOLIC ADAS CAR ================= -->
    <defs>
      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
      <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.25" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="floorMask"><rect x="700" y="230" width="580" height="190" fill="url(#fadeL)"/></mask>
      <linearGradient id="chev" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E8F4FF"/><stop offset="1" stop-color="#6FA8FF"/>
      </linearGradient>
    </defs>

    <!-- perspective floor -->
    <g mask="url(#floorMask)" stroke="#2F6BFF" stroke-opacity="0.35" stroke-width="1">
      <path d="M1000 240 L700 420 M1000 240 L820 420 M1000 240 L940 420 M1000 240 L1060 420 M1000 240 L1180 420 M1000 240 L1300 420 M1000 240 L1420 420"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 30" dur="1.2s" repeatCount="indefinite"/>
        <path d="M700 252 H1280 M700 266 H1280 M700 286 H1280 M700 314 H1280 M700 352 H1280 M700 400 H1280"/>
      </g>
    </g>
    <!-- floor glow -->
    <ellipse cx="1010" cy="322" rx="260" ry="30" fill="#2F6BFF" opacity="0.35" filter="url(#soft)"/>

    <!-- data specks -->
    <g fill="#9FD8FF">
      <rect x="760" y="380" width="4" height="4"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="880" y="356" width="3" height="3"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="1240" y="372" width="4" height="4"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></rect>
      <rect x="1120" y="398" width="3" height="3"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="980" y="404" width="4" height="4"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- chevrons (direction of travel) -->
    <g fill="none" stroke="url(#chev)" stroke-linecap="square" stroke-linejoin="miter" filter="url(#neon)">
      <path d="M800 92 L810 104 L800 116" stroke-width="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0s" repeatCount="indefinite"/></path>
      <path d="M850 84 L866 104 L850 124" stroke-width="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.15s" repeatCount="indefinite"/></path>
      <path d="M915 74 L938 104 L915 134" stroke-width="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></path>
      <path d="M1000 62 L1032 104 L1000 146" stroke-width="7"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.45s" repeatCount="indefinite"/></path>
      <path d="M1110 46 L1154 104 L1110 162" stroke-width="9"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></path>
    </g>

    <!-- sensor ripples from the nose -->
    <g fill="none" stroke="#3EF0D0" filter="url(#neon)">
      <ellipse cx="1196" cy="318" rx="20" ry="5" stroke-width="2.5">
        <animate attributeName="rx" values="20;150" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="5;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1196" cy="318" rx="20" ry="5" stroke-width="2.5" opacity="0">
        <animate attributeName="rx" values="20;150" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="5;34" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1196" cy="318" rx="20" ry="5" stroke-width="2.5" opacity="0">
        <animate attributeName="rx" values="20;150" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="5;34" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- car symbol (neon wireframe coupe) -->
    <g transform="translate(790,316)">
      <g fill="none" stroke="#3EF0D0" stroke-linejoin="round" stroke-linecap="round" filter="url(#neon)">
        <!-- body silhouette -->
        <path stroke-width="3" d="M10 -30 L8 -58 Q12 -72 40 -76 L120 -84 Q170 -122 230 -126 Q282 -126 322 -92 L394 -78 Q418 -72 420 -50 L416 -30 L374 -30 A44 44 0 0 0 286 -30 L144 -30 A44 44 0 0 0 56 -30 Z"/>
        <!-- windows -->
        <path stroke-width="2" d="M142 -86 Q180 -112 226 -115 L230 -90 Z M244 -115 Q276 -113 300 -91 L242 -90 Z"/>
        <!-- wireframe facets -->
        <g stroke-width="1" stroke-opacity="0.55">
          <path d="M40 -76 L144 -30 M120 -84 L200 -30 M230 -90 L286 -30 M322 -92 L374 -30 M394 -78 L350 -56 M200 -30 L230 -90 M144 -30 L120 -84 M40 -60 L394 -66 M286 -30 L322 -92"/>
        </g>
        <!-- wheels -->
        <circle cx="100" cy="-30" r="36" stroke-width="3"/>
        <circle cx="330" cy="-30" r="36" stroke-width="3"/>
        <circle cx="100" cy="-30" r="20" stroke-width="1.5" stroke-opacity="0.7"/>
        <circle cx="330" cy="-30" r="20" stroke-width="1.5" stroke-opacity="0.7"/>
        <g stroke-width="1.5" stroke-opacity="0.8">
          <path d="M100 -50 V-10 M80 -30 H120">
            <animateTransform attributeName="transform" type="rotate" from="0 100 -30" to="360 100 -30" dur="0.6s" repeatCount="indefinite"/>
          </path>
          <path d="M330 -50 V-10 M310 -30 H350">
            <animateTransform attributeName="transform" type="rotate" from="0 330 -30" to="360 330 -30" dur="0.6s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
      <!-- lights -->
      <path d="M402 -68 L418 -62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
      <path d="M8 -62 L16 -60" stroke="#FF4D3A" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
      <!-- light sweep across the body -->
      <clipPath id="bodyClip"><path d="M10 -30 L8 -58 Q12 -72 40 -76 L120 -84 Q170 -122 230 -126 Q282 -126 322 -92 L394 -78 Q418 -72 420 -50 L416 -30 L374 -30 A44 44 0 0 0 286 -30 L144 -30 A44 44 0 0 0 56 -30 Z"/></clipPath>
      <g clip-path="url(#bodyClip)"><rect x="0" y="-130" width="40" height="110" fill="#BFFFF2" opacity="0.18" transform="skewX(-20)">
        <animate attributeName="x" values="-40;440" dur="3s" repeatCount="indefinite"/>
      </rect></g>
    </g>

    <!-- minimal HUD tags -->
    <g class="mono" font-size="11" font-weight="700">
      <text x="1256" y="372" text-anchor="end" fill="#3EF0D0">RADAR · LiDAR</text>
      <circle cx="1160" cy="214" r="3.5" fill="#3DDC84"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
      <text x="1170" y="218" fill="#3DDC84">ADAS ON</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="none" stroke="#2C4370"/>
</svg>
